name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build-backend:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Compute image name (GHCR needs lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-backend" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          file: infrastructure/docker/Dockerfile.backend
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Compute image name (GHCR needs lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-frontend" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://${{ vars.APP_DOMAIN }}
            NEXT_PUBLIC_APP_URL=https://${{ vars.APP_DOMAIN }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    env:
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_USER: ${{ secrets.VM_USER }}
      APP_DOMAIN: ${{ vars.APP_DOMAIN }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Upload compose file and Caddyfile
        run: |
          scp infrastructure/azure/docker-compose.prod.yml infrastructure/azure/Caddyfile \
            "$VM_USER@$VM_HOST:/opt/skynest/"
          scp -r database/migrations "$VM_USER@$VM_HOST:/opt/skynest/"

      - name: Deploy
        run: |
          ssh "$VM_USER@$VM_HOST" "IMAGE_TAG=${{ github.sha }} bash -s" <<'EOF'
          set -euo pipefail
          cd /opt/skynest
          if grep -q '^IMAGE_TAG=' .env; then
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${IMAGE_TAG}/" .env
          else
            echo "IMAGE_TAG=${IMAGE_TAG}" >> .env
          fi
          # IMPORTANT: this script reaches the VM as bash's stdin (ssh ... bash -s <<EOF).
          # Every `docker compose exec -T` below must read from /dev/null or from a file;
          # otherwise docker swallows the rest of this script and the deploy silently stops
          # (this is why the pull/up steps and the migrations never ran before).
          DC="docker compose -f docker-compose.prod.yml"
          set -a
          [ -f .env ] && . ./.env
          set +a

          # 1. Start postgres and wait until ready
          $DC up -d postgres
          echo "Waiting for PostgreSQL database container to be healthy..."
          until $DC exec -T postgres pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" </dev/null >/dev/null 2>&1; do
            sleep 2
          done

          # 2. Automated Migration Runner (tracks applied migrations in schema_migrations).
          # A failing migration rolls back, is NOT recorded, and aborts the deploy before
          # new containers start, so the site keeps running the previous version.
          psql_q() { $DC exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -t -A "$@" </dev/null; }

          psql_q -c "
            CREATE TABLE IF NOT EXISTS schema_migrations (
              id SERIAL PRIMARY KEY,
              filename VARCHAR(255) UNIQUE NOT NULL,
              applied_at TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP
            );
          "

          for f in $(ls -1 migrations/*.sql | sort); do
            fname=$(basename "$f")
            applied=$(psql_q -c "SELECT COUNT(*) FROM schema_migrations WHERE filename = '$fname';")
            if [ "$applied" = "0" ]; then
              echo "Applying migration: $fname..."
              $DC exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 --single-transaction -f - < "$f"
              psql_q -c "INSERT INTO schema_migrations (filename) VALUES ('$fname');"
            else
              echo "Migration $fname already applied, skipping."
            fi
          done

          # 3. Pull and update backend & frontend
          $DC pull backend frontend
          $DC up -d --remove-orphans
          sleep 5
          $DC exec -T caddy caddy reload --config /etc/caddy/Caddyfile </dev/null
          docker image prune -f

          # 4. Fail the job if the running containers are not the images we just deployed
          for s in backend frontend; do
            img=$($DC ps -q "$s" | xargs docker inspect --format '{{.Config.Image}}')
            case "$img" in
              *":${IMAGE_TAG}") echo "$s is running $img" ;;
              *) echo "ERROR: $s is running $img, expected tag ${IMAGE_TAG}"; exit 1 ;;
            esac
          done
          EOF

      - name: Smoke test
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 6 --retry-all-errors "https://${APP_DOMAIN}/health"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null "https://${APP_DOMAIN}/"

      - name: Verify backend is on Postgres, not the in-memory fallback
        run: |
          if ssh "$VM_USER@$VM_HOST" "cd /opt/skynest && docker compose -f docker-compose.prod.yml logs backend" | grep -q "in-memory"; then
            echo "Backend fell back to the in-memory database"
            exit 1
          fi
