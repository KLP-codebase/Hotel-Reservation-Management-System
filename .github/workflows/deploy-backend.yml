name: Deploy Backend → Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "infrastructure/cloudflare/workers/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "production"
        type: choice
        options: [production, staging]

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Run DB migrations first ────────────────────────────────────────────────
  migrate:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run Prisma migrations
        working-directory: backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # ── Deploy Worker ──────────────────────────────────────────────────────────
  deploy-worker:
    name: Deploy API Worker
    runs-on: ubuntu-latest
    needs: [migrate]
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Worker dependencies
        working-directory: infrastructure/cloudflare/workers
        run: npm ci

      - name: Deploy Worker via Wrangler
        working-directory: infrastructure/cloudflare/workers
        run: |
          ENV="${{ github.event.inputs.environment || 'production' }}"
          npx wrangler deploy --env $ENV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Set Worker secrets
        working-directory: infrastructure/cloudflare/workers
        run: |
          echo "${{ secrets.JWT_SECRET }}" | npx wrangler secret put JWT_SECRET
          echo "${{ secrets.DATABASE_URL }}" | npx wrangler secret put DATABASE_URL
          echo "${{ secrets.PAYHERE_MERCHANT_SECRET }}" | npx wrangler secret put PAYHERE_MERCHANT_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

  # ── Smoke test ─────────────────────────────────────────────────────────────
  smoke-test:
    name: Post-Deploy Smoke Test
    runs-on: ubuntu-latest
    needs: [deploy-worker]
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: Health check
        run: |
          sleep 10
          curl --fail --retry 5 --retry-delay 5 \
            ${{ secrets.API_URL }}/health \
            -H "Accept: application/json"
        env:
          API_URL: ${{ secrets.API_URL }}
